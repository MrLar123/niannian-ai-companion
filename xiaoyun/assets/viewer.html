<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>3D 御姐模型查看器</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#eceff3;}
  canvas{display:block;}
  #hint{position:fixed;left:12px;bottom:10px;font:12px/1.6 "Microsoft YaHei",sans-serif;
        color:#555;background:rgba(255,255,255,.8);padding:6px 10px;border-radius:8px;}
  #load{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
        font:14px "Microsoft YaHei",sans-serif;color:#888;}
</style>
<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/"
  }
}
</script>
</head>
<body>
<div id="load">模型加载中…</div>
<div id="hint">拖拽旋转 · 滚轮缩放</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.01, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8d99ae, 1.5));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(1.2, 2.0, 2.4); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 1.1); fill.position.set(-2.0, 1.0, 1.2); scene.add(fill);
const rim = new THREE.DirectionalLight(0xc9d8ff, 1.4); rim.position.set(0, 1.2, -2.4); scene.add(rim);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.4;

new GLTFLoader().load('./yujie.glb', (gltf) => {
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  model.position.sub(center);            // 让模型几何中心落在原点
  model.rotation.y = Math.PI;            // 正面朝向相机
  scene.add(model);

  const fov = camera.fov * Math.PI / 180;
  const dist = (size.y / 2) / Math.tan(fov / 2) * 1.12;
  camera.position.set(0, 0, dist);
  camera.lookAt(0, 0, 0);
  controls.target.set(0, 0, 0);
  controls.update();

  document.getElementById('load').remove();
}, undefined, (err) => {
  document.getElementById('load').textContent = '加载失败: ' + err;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
