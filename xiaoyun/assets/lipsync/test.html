<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>念念口型同步 · 自测</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:24px; font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;
         background:#15121b; color:#e9e4f2; }
  h1 { font-size:16px; font-weight:600; margin:0 0 4px; letter-spacing:.5px; }
  .sub { color:#8d8599; font-size:12px; margin-bottom:18px; }
  textarea { width:100%; height:64px; box-sizing:border-box; padding:10px; border-radius:10px;
             border:1px solid #352c42; background:#1d1826; color:#e9e4f2; font:inherit; resize:vertical; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:12px 0 22px; }
  button { padding:8px 16px; border-radius:10px; border:1px solid #6b4a5e;
           background:linear-gradient(#3a2a3a,#2a1f2c); color:#f3d9e3; font:inherit; cursor:pointer; }
  button:hover { border-color:#c98aa6; }
  .bars { display:flex; gap:14px; align-items:flex-end; height:180px; margin-bottom:6px; }
  .bar { width:64px; text-align:center; }
  .bar .tube { height:150px; background:#221c2c; border-radius:8px; position:relative; overflow:hidden;
               border:1px solid #33293f; }
  .bar .fill { position:absolute; left:0; right:0; bottom:0; height:0;
               background:linear-gradient(#eaa7b2,#b5657f); transition:height .03s linear; }
  .bar .cap { font-size:12px; color:#a99bb8; margin-top:6px; }
  .meta { font:12px/1.8 ui-monospace,Consolas,monospace; color:#8d8599; white-space:pre-wrap; }
  audio { width:100%; margin-top:8px; }
</style>
</head>
<body>
  <h1>口型同步自测台</h1>
  <div class="sub">方案 B：文本 → 拼音 → 五元音口型 + 音频包络对齐。此处只显示引擎输出，不渲染模型。</div>

  <textarea id="txt">你好呀，我是念念。今天想陪你聊点什么？</textarea>

  <div class="row">
    <button id="playLocal">播放 last_reply.mp3</button>
    <button id="playFileBtn">播放我选的音频</button>
    <input type="file" id="file" accept="audio/*" style="display:none">
    <button id="stop">停止</button>
    <label style="font-size:12px;color:#a99bb8">
      <input type="checkbox" id="debug"> 控制台调试
    </label>
  </div>

  <div class="bars" id="bars"></div>

  <audio id="au" controls></audio>
  <div class="meta" id="meta">等待播放…</div>

<script src="/assets/lipsync/lipsync.js"></script>
<script>
(function(){
  var VOWELS = ['a','i','u','e','o'];
  var barsEl = document.getElementById('bars');
  var au = document.getElementById('au');
  var metaEl = document.getElementById('meta');
  var txt = document.getElementById('txt');
  var sync = null, url = null, raf = 0;

  VOWELS.forEach(function(v){
    var d = document.createElement('div');
    d.className = 'bar';
    d.innerHTML = '<div class="tube"><div class="fill" id="f_' + v + '"></div></div>' +
                  '<div class="cap">' + v + '</div>';
    barsEl.appendChild(d);
  });

  XiaoyunLipSync.init({ dictUrl: '/assets/lipsync/zh-visemes.json' })
    .then(function(){ metaEl.textContent = '字典已就绪，点上面按钮开始。'; });

  function loop(){
    raf = requestAnimationFrame(loop);
    if (!sync) return;
    VOWELS.forEach(function(v){
      document.getElementById('f_' + v).style.height =
        Math.min(100, sync.weights[v] * 100) + '%';
    });
    var st = sync.ready
      ? ('keys=' + sync.keys + '  segments=' + (sync.segments ? sync.segments.length : 0))
      : '解码中…';
    metaEl.textContent = 't=' + au.currentTime.toFixed(2) + 's  open=' +
      sync.weights.open.toFixed(2) + '  viseme=' + sync.viseme + '  ' + st +
      (sync.mode ? '  mode=' + sync.mode : '');
  }
  loop();

  function play(src, name){
    if (url && url.indexOf('blob:') === 0 && url !== src) URL.revokeObjectURL(url);
    url = src;
    au.src = src;
    au.play().catch(function(e){ metaEl.textContent = '播放失败：' + e; });
    if (sync && sync.stop) sync.stop();
    sync = XiaoyunLipSync.attach(au, txt.value, { debug: document.getElementById('debug').checked });
  }

  document.getElementById('playLocal').onclick = function(){
    play('/assets/lipsync/sample.mp3', 'last_reply.mp3');
  };
  document.getElementById('playFileBtn').onclick = function(){
    document.getElementById('file').click();
  };
  document.getElementById('file').onchange = function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    play(URL.createObjectURL(f), f.name);
  };
  document.getElementById('stop').onclick = function(){
    au.pause();
    au.currentTime = 0;
    if (sync) sync.stop();
  };
})();
</script>
</body>
</html>
