<!DOCTYPE html>
<html style="margin:0;padding:0;">
<head>
<meta charset="UTF-8">
<title>和念念聊天</title>
<style>
  :root{ --pink:#EAA7B2; --pink-deep:#d97891; --ink:#2a2230; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; width:100%; overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei",Segoe UI,Arial,sans-serif;
    background:linear-gradient(160deg,#fdeef2 0%,#eef1fb 100%); }
  #panel{ height:100%; display:flex; flex-direction:column; }
  #ph{ padding:14px 16px; display:flex; align-items:center; gap:11px;
    border-bottom:1px solid rgba(217,120,145,.2); background:rgba(255,255,255,.6); }
  #avatar{ width:38px; height:38px; border-radius:50%; flex:none; color:#fff; font-size:20px;
    background:linear-gradient(135deg,var(--pink),#c9a7e8);
    display:flex; align-items:center; justify-content:center; }
  #ph h1{ font-size:16px; margin:0; color:var(--ink); }
  #ph small{ font-size:12px; color:#8a7d8c; }
  #chat{ flex:1; overflow-y:auto; padding:16px 14px; display:flex; flex-direction:column; gap:11px; }
  .msg{ max-width:84%; padding:9px 13px; border-radius:15px; font-size:14px; line-height:1.6;
    white-space:pre-wrap; word-break:break-word; }
  .me{ align-self:flex-end; color:#fff; border-bottom-right-radius:4px;
    background:linear-gradient(135deg,var(--pink),var(--pink-deep)); }
  .her{ align-self:flex-start; background:#fff; color:var(--ink); border:1px solid rgba(0,0,0,.05);
    border-bottom-left-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  .sys{ align-self:center; font-size:12px; color:#9a8f9c; }
  #composer{ padding:10px 12px 14px; border-top:1px solid rgba(217,120,145,.18);
    display:flex; gap:8px; background:rgba(255,255,255,.5); }
  #inp{ flex:1; resize:none; border:1px solid rgba(217,120,145,.35); border-radius:13px;
    padding:9px 12px; font-size:14px; font-family:inherit; max-height:90px; outline:none;
    background:#fff; color:var(--ink); }
  #inp:focus{ border-color:var(--pink-deep); }
  #send,#reset{ border:0; border-radius:13px; cursor:pointer; font-size:14px; font-family:inherit; }
  #send{ padding:0 17px; color:#fff; background:linear-gradient(135deg,var(--pink),var(--pink-deep)); }
  #send:disabled{ opacity:.6; cursor:default; }
  #reset{ padding:0 9px; background:transparent; color:#b28; font-size:17px; }
  #typing{ font-size:12px; color:#b06; padding:2px 14px 0; display:none; }
  #bar{ font-size:11px; color:#8a7d8c; padding:4px 14px; }
</style>
</head>
<body>
  <div id="panel">
    <div id="ph">
      <div id="avatar">&hearts;</div>
      <div><h1>念念</h1><small>本地 AI 女友 · 数据留在本机</small></div>
    </div>
    <div id="bar"></div>
    <div id="chat"></div>
    <div id="typing">念念正在输入…</div>
    <div id="composer">
      <button id="reset" title="清空记忆">&olarr;</button>
      <textarea id="inp" rows="1" placeholder="对念念说点什么…（回车发送）"></textarea>
      <button id="send">发送</button>
    </div>
  </div>

<script>
(function(){
  var chat = document.getElementById('chat');
  var inp  = document.getElementById('inp');
  var send = document.getElementById('send');
  var typing = document.getElementById('typing');
  var busy = false, curAudio = null;

  function add(cls, text){
    var d = document.createElement('div');
    d.className = 'msg ' + cls; d.textContent = text;
    chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
    return d;
  }

  fetch('/api/history').then(function(r){return r.json();}).then(function(j){
    var h = (j && j.history) || [];
    if(!h.length){ add('sys','— 还没有聊天记录，说句话吧 —'); return; }
    h.forEach(function(m){ add(m.role === 'user' ? 'me' : 'her', m.content); });
  }).catch(function(){ add('sys','无法读取历史记录'); });

  fetch('/api/health').then(function(r){return r.json();}).then(function(j){
    if(!(j && j.ok)) return;
    // 显示"实际在用的"模型与音色（中文名优先）：voice / voice_label 由后端按引擎给出，
    // 不再固定显示 edge 兜底声线，避免看起来像音色被重置了。
    document.getElementById('bar').textContent =
      '大脑 ' + (j.model_label || j.model) + ' · 音色 ' + (j.voice_label || j.voice);
  }).catch(function(){});

  function sendMsg(){
    var t = inp.value.trim();
    if(!t || busy) return;
    busy = true; send.disabled = true;
    add('me', t); inp.value=''; inp.style.height='auto';
    typing.style.display='block';
    fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message:t}) })
      .then(function(r){ return r.json(); })
      .then(function(j){
        typing.style.display='none';
        if(j.ok){
          add('her', j.reply);
          // 只在"念念本体不在桌面上"时才由本窗口发声，否则两边同时播会两个声音重合。
          // 判断由后端给出：宠物窗是否还在轮询 /api/last。
          if(j.play_here && j.audio){
            try{ if(curAudio) curAudio.pause(); curAudio = new Audio(j.audio);
              curAudio.play().catch(function(){}); }catch(e){}
          }
        } else {
          add('sys','出错了：' + (j.error || '未知错误'));
        }
      })
      .catch(function(e){ typing.style.display='none'; add('sys','无法连接后端（8090）：' + e.message); })
      .finally(function(){ busy=false; send.disabled=false; inp.focus(); });
  }

  send.addEventListener('click', sendMsg);
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
  inp.addEventListener('input', function(){ inp.style.height='auto'; inp.style.height=Math.min(90,inp.scrollHeight)+'px'; });
  document.getElementById('reset').addEventListener('click', function(){
    fetch('/api/reset',{method:'POST'}).then(function(){
      chat.innerHTML = '<div class="sys">— 已清空记忆，重新开始 —</div>';
    });
  });
  inp.focus();
})();
</script>
</body>
</html>
