   · 首次拿到 seq 只对表不播，避免页面刚加载把历史反应重放一遍。
   调试口（控制台）：__xyActivity.fire('error') / .fire('success') / 直接看对象状态。 */
const ACTIVITY_DUR   = 2.6;    // 表情总时长（秒）
const ACTIVITY_RISE  = 0.35;   // 快起段
const ACTIVITY_TAU   = 0.9;    // 指数收尾常数（慢收，避免"抽搐式"消失）
const ACTIVITY_POLL_MS = 2000;
const activity = {
  seq: -1,                     // 已消费的 signal_seq（-1 = 尚未对表）
  enabled: true,               // 404 后置 false，轮询自停
  active: false, t0: 0, grp: null,
  lastSignal: 'none',          // 最近一次的反应类型（调试看）

  fire: function (grp) {
    if (!morphMesh || poke.active) return;
    if (!activityFace[grp] || !activityFace[grp].length) return;
    this.grp = grp; this.active = true;
    /* 与 loop 的 t 同基准：t = (performance.now() - 页面t0)/1000（poke 同口径） */
    this.t0 = (performance.now() - t0) / 1000;
  },

  /* 每帧调用（loop 里 poke.tick 之后）：快起慢收的小表情 */
  tick: function (tNow) {
    if (!this.active) return;
    const dt = tNow - this.t0;
    if (dt < 0 || dt > ACTIVITY_DUR) {
      this.active = false;
      if (this.grp) this._face(0, this.grp);   // 收尾清零
      this.grp = null;
      return;
    }
    const emo = dt < ACTIVITY_RISE
      ? dt / ACTIVITY_RISE
      : Math.exp(-(dt - ACTIVITY_RISE) / ACTIVITY_TAU);
    this._face(Math.min(1, emo), this.grp);
  },

  /* 只写表情不碰骨骼（同 poke._face 的定位）；清零时两组都清，防残留 */
  _face: function (emo, grp) {
    const inf = morphMesh && morphMesh.morphTargetInfluences;
    if (!inf) return;
    for (const g in activityFace) {
      if (g === grp && emo > 0) continue;
      for (const e of activityFace[g]) inf[e[0]] = 0;
    }
    for (const e of (activityFace[grp] || [])) {
      inf[e[0]] = Math.min(1, emo * e[1]);
    }
    if (emo > 0.01) {          // 说话口型让位（受惊张嘴那半秒不该还在念字）
      for (const v of mVowels) {
        if (v >= 0) inf[v] *= (1 - 0.85 * Math.min(1, emo));
      }
    }
  },
};
window.__xyActivity = activity;

function pollActivity() {
  if (!activity.enabled) return;
  fetch('/api/context/activity', { cache: 'no-store' }).then(function (r) {
    if (r.status === 404) { activity.enabled = false; return null; }
    return r.json();
  }).then(function (j) {
    if (!j || !j.enabled) return;
    if (activity.seq < 0) { activity.seq = j.signal_seq; return; }
    if (j.signal_seq !== activity.seq) {
      activity.seq = j.signal_seq;
      activity.lastSignal = j.signal || 'none';
      if (j.signal === 'error' || j.signal === 'success') activity.fire(j.signal);
    }
  }).catch(function () {});
}
setInterval(pollActivity, ACTIVITY_POLL_MS);

/* ===================== 大脑真状态（P3 DSH 式呈现） =====================
   后端在 brain_chat 的生命周期里推进 BRAIN_STATE（thinking→idle/error），
   这里 2s 轮询 /api/brain/state，thinking 时气泡位弹出"她在想…"三点药丸，
   error 时短暂显示"刚才走神了"。气泡在显示时药丸自动下移 58px 避让。
   失败静默：状态呈现是旁路功能，绝不影响主对话链路。 */
const thinkEl = document.getElementById('think');
let brainShown = false;
function pollBrain() {
  fetch('/api/brain/state', { cache: 'no-store' }).then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (j) {
    if (!j || !j.ok) return;
    const bubbleEl = document.getElementById('bubble');
    thinkEl.style.top = (bubbleEl && bubbleEl.classList.contains('show')) ? '72px' : '14px';
    const want = (j.state === 'thinking' || j.state === 'error');
    if (j.state === 'thinking') {
      thinkEl.innerHTML = '她在想<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    } else if (j.state === 'error') {
      /* 只展示一个轮询周期，下一轮 idle 自然消失 */
      thinkEl.innerHTML = '刚才走神了…';
    }
    if (want !== brainShown) {
      brainShown = want;
      thinkEl.classList.toggle('show', want);
    }
  }).catch(function () {});
}
setInterval(pollBrain, 2000);

/* 150ms 轮询后端。fetch 失败静默 —— 眼神是旁路功能，绝不能影响主对话链路 */
setInterval(function () { gaze.poll(); }, GAZE_POLL_MS);

/* 眼骨驱动（抽成独立函数：动作模式下 mixer 写完全部骨骼后也要叠一层，
   所以 loop 的两个分支都会调它 —— 眼神永远在线，与动作/待机无关）。
   返回 gaze 偏移量（null = 本帧不驱动），供调用方叠加头部微跟随。
   ★ 符号：rotation.y+ = 看向画面右、rotation.x+ = 看向画面下（2026-10-19 用户实测定档）。
     早前那版取负号，结果"鼠标向右、眼球向左"，已翻正。
   ★ EYE_YAW_MIRROR：左右目骨 Y 轴是否互为反向。实测同号=双眼同向（该模型导出时已镜像），
     默认 false；若换的模型出现"斗鸡眼"，改成 true 即可。 */
function applyGazeEyes() {
  const gz = gaze.offsets();
  if (!gz) return null;
  const gy = gz.yaw, gp = gz.pitch;
  setBone('eyeL', gp, gy, 0);
  setBone('eyeR', gp, gy * (EYE_YAW_MIRROR ? -1 : 1), 0);
  return gz;
}

/* 头部分跟随量：把眼神角度拆到 首骨/頭骨 两节上。
   dance 与 idle 两条路径共用同一套算式 —— 不然两条路各自算，头感会不一致
   （上一版就是 dance 只叠 0.75 倍、pitch 又只有 9°，结果上下基本没动）。
   返回 null = 本帧不驱动（与 gaze.offsets 的裁决完全一致）。 */
function gazeHeadParts() {
  const gz = gaze.offsets();
  if (!gz) return null;
  return {
    neckY: gz.yaw   * GAZE_HEAD_YAW   * 0.45,
    headY: gz.yaw   * GAZE_HEAD_YAW   * 0.55,
    neckX: gz.pitch * GAZE_HEAD_PITCH * 0.25,
    headX: gz.pitch * GAZE_HEAD_PITCH * 0.75,
  };
}

/* 动作模式下的头部跟随。
   mixer 每帧把 VMD 轨道重写成绝对值，这里在其之后做 += 增量，
   所以动作原有的头部表演仍然保留，只是整体朝光标再偏一点 —— 不会把动作抹平。 */
function applyGazeHead(scale) {
  const hp = gazeHeadParts();
  if (!hp) return;
  const k = (scale === undefined ? 1 : scale);
  const nk = bones.neck, hd = bones.head;
  if (nk) { nk.rotation.y += hp.neckY * k; nk.rotation.x += hp.neckX * k; }
  if (hd) { hd.rotation.y += hp.headY * k; hd.rotation.x += hp.headX * k; }
}

function animateBones(t) {
  if (!bones || !Object.keys(bones).length) return;
  const br   = Math.sin(t * 1.4);          // 呼吸
  const look = Math.sin(t * 0.35);         // 头部左右看
  const wgt  = Math.sin(t * 0.45);         // 腿部承重交换

  // 呼吸（缩放中心在 rig 原点，不改变位置）
  // 整体缩放压到几乎看不见，"活着"的感觉交给胸腔起伏和裙摆，避免整个人一胀一缩
  rig.scale.setScalar(1 + br * BREATH_SCALE);

  const set = (k, x, y, z) => {
    const b = bones[k]; if (!b) return;
    const hm = boneHome[k];
    b.rotation.set(hm.rx + x, hm.ry + y, hm.rz + z);
  };
  const lock = (k) => {
    const b = bones[k]; if (!b) return;
    const hm = boneHome[k];
    if (hm) b.rotation.set(hm.rx, hm.ry, hm.rz);
  };

  /* ---- 臀部左右扭腰（用户要求）----
     扭腰 = 髋部绕 Y 轴左右转，上半身反向补偿，形成自然的 S 型摆动。
     关键点：センター（hip）必须锁死——它一动整个人就平移，那就是"漂移"了。
     所以：下半身(臀) 左右扭 → 上半身 反向扭 → 头再补一点，脚不动。 */
  const sway = Math.sin(t * 0.55);              // 扭腰主频（比摆动慢，更慵懒）
  set('lowerBody', 0, sway * 0.10, 0);          // 臀部左右摆 5.7°
  set('spine', br * 0.010, -sway * 0.075, 0);   // 上身反向补偿；x 上的一点起伏 = 呼吸扩胸
  set('chest', br * 0.016, -sway * 0.045, 0);
  lock('hips');                                 // センター 锁死 = 脚不会飘

  // 到点了就随机来一个小动作（歪头 / 点头 / 挥手）
  if (!gesture && t >= nextGestureAt) pickGesture(t);
  const g = gestureOffsets(t);
  const hp = gazeHeadParts();          // 眼神的头部跟随（左右/上下分别加权）
  const hNy = hp ? hp.neckY : 0, hHy = hp ? hp.headY : 0;
  const hNx = hp ? hp.neckX : 0, hHx = hp ? hp.headX : 0;

  // 头：左右张望（在扭腰基础上再补一点，显得活泼）+ 极轻微歪头 + 小动作叠加
  // 眼神的头部跟随：眼是主体、头跟着带（GAZE_HEAD_YAW/PITCH），
  // 不然纯眼球转动在 560px 的小窗口里几乎看不出来。
  // 左右分摊到 首/頭 两节（45/55），上下主要给頭骨（25/75）—— 点头比扭头更明显。
  // ★ 只有 idle 分支走这里；dance 模式由 applyGazeHead 叠加（见 loop）。
  set('neck', hNx, look * 0.11 + g.neckY + hNy, 0);
  set('head', g.headX + hHx, hHy,
      Math.sin(t * 0.27) * 0.022 + g.headZ);

  /* ---- 手臂（方案 A：自然垂放）----
     基础姿势 = A-pose 下压 ARM_DROP(~31°) + 略向前摆(ARM_FWD) + 肘微弯(ELBOW_BEND)，
     手落在大腿前侧，看起来是"自然站着"。小动作（挥手）以叠加偏移的方式
     加在这之上，动作结束自动回到基础姿势 —— 两层互不干扰。 */
  set('armL', ARM_FWD + g.armX.L, 0, -ARM_DROP + g.armZ.L);
  set('armR', ARM_FWD + g.armX.R, 0,  ARM_DROP + g.armZ.R);
  set('foreArmL', ELBOW_BEND + g.foreX.L, 0, g.foreZ.L);
  set('foreArmR', ELBOW_BEND + g.foreX.R, 0, g.foreZ.R);

  /* 手腕翻掌（绕前臂长轴扭转）。window.__xyTwist 仅供调试：写 {L:1.2} 可实时试角度 */
  const tw = window.__xyTwist || {};
  twistBone('twistL', 'tipL', g.twist.L + (tw.L || 0));
  twistBone('twistR', 'tipR', g.twist.R + (tw.R || 0));

  // 腿：承重随扭腰左右交换（只做前后，不做左右张，避免脚飘）
  set('legL', wgt * 0.035, 0, 0);
  set('legR', -wgt * 0.035, 0, 0);
  lock('shinL'); lock('shinR');

  /* ---- 裙摆 / 头发 / 脖饰：绕身传播的行进波 ---- */
  animateSway(t, sway, look);

  applyFace(t, true);
}

/* ---- 面部：表情 / 眨眼 / 口型 ----
   full=true  = 内置待机模式：微笑也由这里给（常驻温和微笑 + 呼吸起伏）；
   full=false = VMD 动作模式：微笑等表情交给动作自带的 morph 轨道，
                这里只保证眨眼与"说话时嘴要动"，否则要么面瘫、要么嘴不动。 */
function applyFace(t, full) {
  if (!morphMesh || !morphMesh.morphTargetInfluences) return;
  const inf = morphMesh.morphTargetInfluences;
  if (full && mSmile >= 0) {
    inf[mSmile] = SMILE_BASE + Math.sin(t * 0.5) * 0.10;
  }
  if (mBlink >= 0) {
    const cyc = t % BLINK_EVERY;
    inf[mBlink] = (cyc < 0.13) ? (1 - cyc / 0.13) : 0;
  }
  if (full && mWink >= 0) inf[mWink] = 0;

  /* ---- 口型：五元音权重 -> あいうえお ----
     引擎已经做过时间对齐、交叉淡化和音量门控，这里只做放大与钳制。
     window.__xyMouthOverride 仅供调试：写 {a,i,u,e,o} 可手动摆口型（不发语音也能验） */
  const mo = window.__xyMouthOverride;
  if (mo || (window.__xyLip && mVowels[0] >= 0)) {
    const w = mo || window.__xyLip.weights;
    const arr = [w.a, w.i, w.u, w.e, w.o];
    for (let vi = 0; vi < 5; vi++) {
      if (mVowels[vi] >= 0) {
        inf[mVowels[vi]] = Math.min(1, arr[vi] * MOUTH_GAIN[vi]);
      }
    }
  }
}

(function loop(){
  requestAnimationFrame(loop);
  const t = (performance.now() - t0) / 1000;
  const dt = Math.min(0.1, (performance.now() - (loop._prev || performance.now())) / 1000);
  loop._prev = performance.now();
  if (rig && !fitting) {
    gaze.update(dt);                       // 眼神平滑（两个分支都要走：切动作时不冻结）
    if (danceOn && mixer) {
      danceHelper.update(danceClock.getDelta());   // VMD 接管骨骼（含 IK/grant 解算）
      lockDanceRoot();
      clampDancePose();
      groundDance();
      applyFace(t, false);                   // 表情不接管：只保眨眼 + 说话口型
      applyGazeEyes();                       // 眼球追随光标（动作模式也必须叠，见函数注释）
      applyGazeHead();                       // 头部也跟着偏（在 VMD 轨道之上做增量，不再打折）
    } else {
      danceClock.getDelta();                 // 空闲时也把时钟走掉，切动作不会一次跳一大步
      animateBones(t);                       // 内置待机（硬编码微动作）
      applyGazeEyes();                       // 眼睛单独写，不参与 animateBones 的整骨覆盖
    }
    rig.rotation.set(0, YAW, 0);
    rig.position.x = 0;
    rig.position.y = baseY + (danceOn ? danceGround.off : 0);
    rig.position.z = 0;
    /* 点击反馈：必须在 rig 归位之后、render 之前 —— 它同时改 rig 位移与骨骼增量，
       放在这里两个动画分支（VMD / 待机）都能叠，且不会被上一步的归位抹掉。 */
    poke.tick(t);
    activity.tick(t);   // 活动反应：同 poke 的时序约束（applyFace 之后、render 之前）
    /* 动作期间用骨骼包围盒算出的固定机位（不跟帧、不追脸）；cx 补偿刀/武器的不对称挥舞 */
    if (danceOn && motionCam) {
      camera.position.set(motionCam.cx, motionCam.cy, motionCam.dist);
      camera.lookAt(motionCam.cx, motionCam.cy, 0);
    }
  }
  renderer.render(scene, camera);
})();

/* ===================== 气泡 + 语音（与其它版本一致） ===================== */
(function(){
  const bubble = document.getElementById('bubble');
  const tip = document.getElementById('tip');
  let seq = 0, bubbleTimer = null, curAudio = null;

  /* ================= 流式语音：裸 PCM + WebAudio 队列 =================
     为什么不用 new Audio(dataURI)：那条路要等后端**整段**合成完（中位 1.9s）
     才有第一个声音，而豆包第一块 PCM 到手只要 0.4s 左右。这里把分片直接排进
     播放队列，边收边播，前端不需要任何解码器（s16le → float32 是一步缩放）。

     ★ 采样率固定 24k（豆包 PCM 通道）。AudioContext 也尽量指定 24k，
       不支持时退回默认采样率 —— buffer 由浏览器自动重采样，功能不受影响。
     ★ AudioContext 必须在**调用栈同步位置**创建/恢复，绝不能等 fetch 回来
       再建：那时已经脱离用户手势，可能以 suspended 状态静默不出声。 */
  const SR_STREAM = 24000;
  const player = {
    ctx: null, gain: null, nextTime: 0, scheduled: 0, gaps: 0, gen: 0,
    sources: [], started: false,
    acquire: function(){
      if (this.ctx) {
        if (this.ctx.state === 'suspended' && this.ctx.resume) this.ctx.resume().catch(function(){});
        return this.ctx;
      }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      let c = null;
      try { c = new AC({ sampleRate: SR_STREAM }); }
      catch (e) { try { c = new AC(); } catch (e2) { return null; } }
      this.ctx = c;
      this.gain = c.createGain();
      this.gain.gain.value = 1;
      this.gain.connect(c.destination);
      if (c.state === 'suspended' && c.resume) c.resume().catch(function(){});
      return c;
    },
    /* 重新开始一次播放：只重置计数，不销毁 AudioContext（复用可以少一次冷启动） */
    restart: function(){
      this.gen++;
      for (let i = 0; i < this.sources.length; i++) {
        try { this.sources[i].stop(0); } catch (e) {}
      }
      this.sources = [];
      this.nextTime = 0;
      this.scheduled = 0;
      this.gaps = 0;
      this.started = false;
      return this.gen;
    },
    push: function(i16){
      const c = this.acquire();
      if (!c || !i16.length) return;
      const f32 = new Float32Array(i16.length);
      let peak = 0;
      for (let i = 0; i < i16.length; i++) {
        const v = i16[i] / 32768;
        f32[i] = v;
        if (v > peak) peak = v;
        else if (-v > peak) peak = -v;
      }
      const ab = c.createBuffer(1, f32.length, SR_STREAM);
      ab.copyToChannel(f32, 0);
      const src = c.createBufferSource();
      src.buffer = ab;
      src.connect(this.gain);
      const now = c.currentTime;
      // 队列见底（合成慢于播放）才算断流，并重新对齐到"现在"避免积压一起播
      if (this.started && this.nextTime < now - 0.02) this.gaps++;
      if (this.nextTime < now + 0.02) this.nextTime = now + 0.05;
      try { src.start(this.nextTime); } catch (e) { return; }
      this.nextTime += ab.duration;
      this.scheduled += ab.duration;
      this.sources.push(src);
      if (this.sources.length > 64) this.sources.splice(0, this.sources.length - 64);
      this.started = true;
    },
    /* 已播秒数 = 已排入总长 - 播放头之后还排着的长度。它和 PCM 的时间轴严格对齐，
       所以口型可以直接拿它当"音频里的第几秒"。 */
    played: function(){
      if (!this.ctx) return 0;
      const ahead = Math.max(0, this.nextTime - this.ctx.currentTime);
      return Math.max(0, this.scheduled - ahead);
    },
    /* 播放头之后还有多少秒没播（<=0 表示真的播完了） */
    idle: function(){
      if (!this.ctx) return 0;
      return Math.max(0, this.nextTime - this.ctx.currentTime);
    }
  };

  /* ---------- 流式口型 ----------
     流式播放没有 audio 元素可交给 XiaoyunLipSync.attach（它靠 audio.currentTime
     与 audio.src 工作），所以这里交给渲染端同形状的东西：weights + stop()。

     开合量来自**真实 PCM 包络**：每块音频到达时按 20ms 一帧算 RMS，播放头落在
     第几帧就取第几帧 —— 与实际发声逐帧对齐，不靠任何预测。
     元音按文本音节顺序推进，节拍用固定 0.22s/字（约 4.5 字/秒）：
     总时长在流式里一直在变，等它出来再等比映射会导致口型回跳，反而更假。 */
  function makeStreamLip(text){
    const F = 0.02;                       // 20ms/帧，与 lipsync 引擎同口径
    const rms = [];
    const spoken = [];                    // 到该帧为止的累计发声秒数（单调递增）
    let acc = 0, peak = 0.06, buf = [];
    let syls = [];
    try {
      if (window.XiaoyunLipSync && window.XiaoyunLipSync.parseText) {
        const raw = window.XiaoyunLipSync.parseText(text) || [];
        for (let i = 0; i < raw.length; i++) if (raw[i]) syls.push(raw[i]);
      }
    } catch (e) { syls = []; }

    const ctl = {
      ready: false, frames: 0,
      weights: { a: 0, i: 0, u: 0, e: 0, o: 0, open: 0 },
      stop: stop
    };
    const NAMES = ['a', 'i', 'u', 'e', 'o'];
    const VIS2NAME = { 1: 'a', 2: 'i', 3: 'u', 4: 'e', 5: 'o' };
    let cur = { a: 0, i: 0, u: 0, e: 0, o: 0 };
    let raf = 0, running = false, lastWall = performance.now();

    function feed(i16){
      for (let i = 0; i < i16.length; i++) buf.push(i16[i] / 32768);
      const win = Math.round(SR_STREAM * F);      // 480 采样
      while (buf.length >= win) {
        let s = 0;
        for (let i = 0; i < win; i++) { const v = buf[i]; s += v * v; }
        const r = Math.sqrt(s / win);
        rms.push(r);
        if (r > peak) peak = r;
        if (r > 0.006) acc += F;                  // 只有真发声的帧才算"讲过去的时间"
        spoken.push(acc);
        buf = buf.slice(win);
      }
      ctl.frames = rms.length;
      ctl.ready = rms.length > 0;
    }

    function ampAt(t){
      if (!rms.length) return 0;
      const fi = Math.floor(t / F);
      let v = 0;
      for (let k = fi - 1; k <= fi + 1; k++) {
        if (k >= 0 && k < rms.length && rms[k] > v) v = rms[k];
      }
      return Math.max(0, Math.min(1, v / Math.max(0.12, peak * 0.7)));
    }

    function visAt(t){
      if (!syls.length) return -1;
      const fi = Math.min(spoken.length - 1, Math.max(0, Math.floor(t / F)));
      const sp = spoken.length ? spoken[fi] : 0;
      const per = 0.22;
      let idx = Math.floor(sp / per);
      if (idx >= syls.length) idx = syls.length - 1;
      const syl = syls[idx];
      if (!syl) return -1;
      const local = sp - idx * per;
      const dOn = Math.min(0.11, Math.max(0.035, per * 0.22));
      if ((syl.vi !== syl.vf || syl.vi === 0) && local < dOn) return syl.vi;
      return syl.vf;
    }

    function frame(){
      if (!running) return;
      raf = requestAnimationFrame(frame);
      const t = player.played();
      const amp = ampAt(t);
      const vis = visAt(t);
      const goal = { a: 0, i: 0, u: 0, e: 0, o: 0 };
      if (amp > 0.03 && vis >= 0) {
        const nm = VIS2NAME[vis];
        if (nm) goal[nm] = 0.25 + 0.75 * amp;     // 与引擎的 open 公式一致
      }
      const now = performance.now();
      const dt = Math.min(0.05, Math.max(0.001, (now - lastWall) / 1000 || 0.016));
      lastWall = now;
      const rising = goal.a + goal.i + goal.u + goal.e + goal.o > cur.a + cur.i + cur.u + cur.e + cur.o;
      const tau = (rising ? 40 : 90) / 1000;
      const alpha = 1 - Math.exp(-dt / Math.max(0.004, tau));
      let sum = 0;
      for (let i = 0; i < NAMES.length; i++) {
        const nm = NAMES[i];
        cur[nm] += (goal[nm] - cur[nm]) * alpha;
        if (cur[nm] < 0) cur[nm] = 0;
        sum += cur[nm];
      }
      if (sum > 1) { for (let i = 0; i < NAMES.length; i++) cur[NAMES[i]] /= sum; sum = 1; }
      for (let i = 0; i < NAMES.length; i++) ctl.weights[NAMES[i]] = cur[NAMES[i]];
      ctl.weights.open = sum;
    }

    function stop(){
      running = false;
      if (raf) cancelAnimationFrame(raf), raf = 0;
      ctl.weights = { a: 0, i: 0, u: 0, e: 0, o: 0, open: 0 };
      cur = { a: 0, i: 0, u: 0, e: 0, o: 0 };
    }

    // 把流式控制器做成和 XiaoyunLipSync.attach() 同形状：渲染循环只认
    // weights 与 stop()，不认识内部实现，所以可以直接替换。
    ctl.ctl = ctl;
    ctl.feed = feed;
    ctl.start = function(){
      running = true;
      lastWall = performance.now();
      frame();
    };
    ctl.stop = function(){ stop(); };
    return ctl;
  }

  function playPcmStream(text, mySeq){
    if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; }
    const myGen = player.restart();
    const lip = makeStreamLip(text);
    const ctl = lip;
    window.__xyLip = ctl;
    window.xiaoyunSpeaking = true;
    const t0 = performance.now();
    let done = false, firstAt = 0, bytes = 0, chunks = 0, streamDone = false;
    let lastReport = 0;

    player.acquire();          // ← 必须在同步栈里建/恢复，脱离手势就静默无声
    lip.start();
    xlog('流式播放开始', 'seq=' + mySeq + ' ' + String(text || '').slice(0, 24));

    /* 把"她正在出声"报给后端，dur = 此刻已排进播放队列的音频总长。
       ★ 流式只有收到最后一块才知道总长，所以要周期性刷新；后端只认第一次
         上报作为播放起点，后续只把 dur 往上顶（见 /api/voice/playing）。
       ★ 不报这一手的后果（实测）：后端退回"按字数估算 + 4s"，40 字算 16s，
         而她实际只讲 6s —— 界面一直卡在「准备开口…」、麦克风还被锁着，
         用户喊半天没反应。 */
    function reportPlaying(force){
      const d = player.scheduled;
      if (d <= 0) return Promise.resolve();
      const now = Date.now();
      if (!force && now - lastReport < 300) return Promise.resolve();  // 节流
      lastReport = now;
      return fetch('/api/voice/playing', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ seq: mySeq, dur: d }), cache: 'no-store'
      }).catch(function(){});
    }

    function cleanup(){
      streamDone = true;
      if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; }
      if (!chunks) fail('没有收到任何音频');
    }

    function finish(reason){
      if (done) return;
      done = true;
      clearInterval(timer);
      lip.stop();
      window.xiaoyunSpeaking = false;
      // ★ 必须先确认"最终总长"已经到达后端，再发"播完"：两条请求若乱序，
      //   后端会拿上一条偏短的 dur 判断收尾，提前开麦。
      reportPlaying(true).then(function(){
        if (window.xiaoyunAudioEnded) window.xiaoyunAudioEnded(mySeq);
      });
      xlog('流式播放结束', 'seq=' + mySeq + ' 音频' + player.scheduled.toFixed(2)
           + 's 分片' + chunks + ' 断流' + player.gaps + (reason ? ' · ' + reason : ''));
    }

    function fail(msg){
      if (done) return;
      done = true;
      clearInterval(timer);
      lip.stop();
      window.xiaoyunSpeaking = false;
      if (chunks) reportPlaying(true);   // 已经放过一部分：让后端按真实长度等
      xlog('流式播放失败', 'seq=' + mySeq + ' ' + msg + ' → 退回整段合成');
      fallbackAudio(text, mySeq);
    }

    /* 兜底：流式这一路挂了（WebAudio 起不来、后端 502、网络断）就退回
       "整段合成 + audio 元素播放"。这就是改流式之前的老路径，一定能出声 ——
       流式是提速，不能成为她哑掉的新故障点。 */
    function fallbackAudio(t, sq){
      fetch('/api/tts_fallback', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: t }), cache: 'no-store'
      }).then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.blob();
      }).then(function(blob){
        const url = URL.createObjectURL(blob);
        const au = new Audio(url);
        curAudio = au;
        window.xiaoyunSpeaking = true;
        au.onloadedmetadata = function(){
          try {
            const d = au.duration;
            if (d && isFinite(d) && d > 0) {
              fetch('/api/voice/playing', { method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dur: d }) }).catch(function(){});
            }
          } catch (e) {}
        };
        au.onended = function(){
          window.xiaoyunSpeaking = false;
          xlog('兜底播放结束', 'seq=' + sq);
          try { URL.revokeObjectURL(url); } catch (e) {}
          if (window.xiaoyunAudioEnded) window.xiaoyunAudioEnded(sq);
        };
        try {
          if (window.XiaoyunLipSync) window.__xyLip = window.XiaoyunLipSync.attach(au, t);
        } catch (e) {}
        au.play().catch(function(e){
          // 连兜底都被拦截/放不出声：绝不能报"讲完了"，只把播放权让出去
          window.xiaoyunSpeaking = false;
          xlog('兜底播放被拦截', String(e && e.name || e));
          fetch('/api/voice/unclaim', { method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ seq: sq }) }).catch(function(){});
        });
      }).catch(function(e){
        window.xiaoyunSpeaking = false;
        xlog('兜底也失败', String(e && e.message || e));
        // 一个音都没放出来 -> 直接交回收音权，别让后端按字数干等
        fetch('/api/voice/resume', { method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ seq: sq }) }).catch(function(){});
      });
    }

    // 播完检测：所有已排入的音频都播完（播放头追平队列尾）才算结束。
    // ★ 不能用"流读完了"当结束 —— 收尾时最后一块可能还要播好几秒。
    // ★ 卡死看门狗：AudioContext 若是 suspended（页面从未被点击过、浏览器
    //   自动播放策略生效），播放头永远不动，idle() 恒大于 0 —— 那条路会让她
    //   永远"正在说话"，语音按钮和收音全被卡住。播放头 4s 不前进就当作播完。
    let lastPlayed = -1, stallMs = 0;
    const timer = setInterval(function(){
      if (player.gen !== myGen) { clearInterval(timer); return; }
      const pl = player.played();
      if (pl > lastPlayed + 0.001) { lastPlayed = pl; stallMs = 0; }
      else stallMs += 120;
      if (streamDone && player.idle() <= 0.02 && player.scheduled > 0) finish();
      // 保护：流已结束但一直闲着（AudioContext 被挂起等）→ 直接收尾，别卡住收音
      else if (streamDone && player.scheduled <= 0) finish();
      else if (player.scheduled > 0 && stallMs > 4000) finish('播放头停滞（AudioContext 可能被挂起）');
    }, 120);

    const ac = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    fetch('/api/tts_stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, seq: mySeq }),
      cache: 'no-store',
      signal: ac ? ac.signal : undefined
    }).then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (!res.body || !res.body.getReader) throw new Error('no stream body');
      const reader = res.body.getReader();
      let carry = new Uint8Array(0);

      function pump(){
        return reader.read().then(function(r){
          if (r.done) { cleanup(); return; }
          if (player.gen !== myGen) { try { reader.cancel(); } catch (e) {} return; }
          const u8 = r.value || new Uint8Array(0);
          let all;
          if (carry.length) {
            all = new Uint8Array(carry.length + u8.length);
            all.set(carry, 0);
            all.set(u8, carry.length);
          } else all = u8;
          const even = all.length - (all.length % 2);
          if (even > 0) {
            const i16 = new Int16Array(all.buffer, all.byteOffset, even >> 1);
            if (!firstAt) {
              firstAt = performance.now() - t0;
              xlog('流式首块音频', Math.round(firstAt) + 'ms ' + (even / 2 / SR_STREAM).toFixed(2) + 's');
            }
            player.push(i16);
            lip.feed(i16);
            bytes += even;
            chunks++;
            reportPlaying();     // 第一块就把"播放起点"告诉后端，之后每次刷新总长
          }
          carry = all.slice(even);
          return pump();
        });
      }
      return pump();
    }).catch(function(e){
      if (String(e && e.name) === 'AbortError') { cleanup(); return; }
      fail(String(e && e.message || e));
    });
  }


  function say(text, audioUri, streamOn, mySeqArg){
    /* ★ seq 在函数入口就固定成常量。以前 mp3 分支直接用外层闭包的 seq，
       而 poll() 收到下一轮回复会改写它 —— 旧音频的 ended 迟到时就会带着
       **新一轮**的 seq 去报"播完了"，后端校验通不过/越过校验，麦克风在她
       还没讲完时被打开，录到自己的声音（自问自答）。流式分支早就修了，
       mp3 兜底分支这次一并对齐。 */
    const mySeq = (mySeqArg != null ? mySeqArg : seq);
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(function(){ bubble.classList.remove('show'); },
                             Math.min(14000, 4200 + text.length * 190));
    // ★ 流式优先：后端这一轮没给 audio，只给了文字 + stream 标记，
    //   音频由页面自己拉裸 PCM。seq 必须在这里固定下来（闭包里的 seq 会被
    //   下一轮改写，导致播完通知带错序号 —— 那正是自问自答的成因之一）。
    if (streamOn && mySeq != null){      playPcmStream(text, mySeq);
      return;
    }
    if (audioUri){
      try{
        if (curAudio) curAudio.pause();
        curAudio = new Audio(audioUri);
        window.xiaoyunSpeaking = true;      // 她开口了：语音按钮要避开这一刻
        xlog('播放回复语音', String(text || '').slice(0, 30));
        // 把**真实音频时长**报给后端：后端据此在她讲完之前绝不再打开麦克风。
        // 否则会在她还在说话时重新收音，把她自己的声音当成用户输入 ->
        // 自问自答死循环（用时间估算不可靠，所以由页面直接报 duration）。
        const reportDur = function(){
          try{
            const d = curAudio && curAudio.duration;
            if (d && isFinite(d) && d > 0){
              fetch('/api/voice/playing', { method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({ dur: d }) }).catch(function(){});
              xlog('上报播放时长', d.toFixed(2) + 's');
            }
          }catch(e){}
        };
        curAudio.onloadedmetadata = reportDur;
        curAudio.onplaying = reportDur;
        // 播完后通知语音模块"她讲完了"，好恢复收音（连续对话模式）。
        // ★ 必须把**这条回复的 seq**一并带上：多个宠物页面/播放被拦截时，
        //   旧音频的 ended 事件可能在**新一轮回复已经开始播放之后**才到达，
        //   后端若不校验 seq 就会立刻打开麦克风 -> 录到她自己的声音 -> 自循环。
        curAudio.onended = function(){
          window.xiaoyunSpeaking = false;
          xlog('语音播放结束', '通知后端恢复收音 seq=' + mySeq + '（本条）');
          if (window.xiaoyunAudioEnded) window.xiaoyunAudioEnded(mySeq);
        };
        curAudio.play().catch(function(e){
          console.warn('audio blocked', e);
          xlog('语音播放被拦截', String(e && e.name || e));
          window.xiaoyunSpeaking = false;
          // ★ 被自动播放策略拦截 = 这段音频**没有出声**，绝不能报"她讲完了"：
          //   否则后端会以为播放结束、立刻恢复收音，而另一个页面（或稍后重试）出声时
          //   麦克风正开着 -> 自问自答。这里只把播放权让出去，让别的页面接着播。
          try{
            fetch('/api/voice/unclaim', { method:'POST',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ seq: mySeq }) }).catch(function(){});
          }catch(e2){}
        });
        /* 口型同步：把"要说的文本 + 这段音频"交给 lipsync 引擎，
           引擎自己在后台解码、算包络、排队口型；渲染循环里读 weights */
        try{
          if (window.XiaoyunLipSync){
            if (window.__xyLip && window.__xyLip.stop) window.__xyLip.stop();
            window.__xyLip = window.XiaoyunLipSync.attach(curAudio, text);
            xlog('口型同步已挂载', String(text || '').length + '字');
          }
        }catch(e){ xlog('口型同步挂载失败', String(e && e.message || e)); }
      }catch(e){ xlog('语音播放异常', String(e)); }
    }
  }
  /* ★ 轮询间隔从 1200ms 收到 400ms：它是流式首响的**最大单项成本**。
     实测（CDP 真跑）：后端 1.35s 就返回了文字，但首块音频要到 1.89s 才落地，
     中间那 0.5s 全是在等下一次轮询。流式把合成时间压到 0.4s 之后，
     "多久能发现新回复"就成了唯一瓶颈 —— 1.2s 的间隔等于白扔掉一半收益。
     /api/last 只是读内存里的 LAST，本地 400ms 一次的开销可以忽略。
     另加 in-flight 闸：上一轮还没回来就跳过，避免网络抖动时请求堆积。 */
  let polling = false;
  function poll(){
    if (polling) return;
    polling = true;
    fetch('/api/last?since=' + seq).then(function(r){ return r.json(); })
      .then(function(j){
        if (j && j.fresh && j.reply){
          seq = j.seq;
          xlog('收到新回复', 'seq=' + j.seq + (j.stream ? ' (流式)' : ''));
          say(j.reply, j.audio, j.stream, j.seq);
        }
      })
      .catch(function(){})
      .then(function(){ polling = false; });
  }
  fetch('/api/history').then(function(r){ return r.json(); }).then(function(j){
    if (j && typeof j.seq === 'number') seq = j.seq;
  }).catch(function(){}).then(function(){ poll(); setInterval(poll, 400); });

  setTimeout(function(){ tip.style.opacity = 0.9; }, 600);
  setTimeout(function(){ tip.style.opacity = 0; }, 7000);
  window.xiaoyunSay = function(text){ if (text) say(text, null); };
})();

/* ===================== 语音对话 =====================
   两种方式（点右下角「🎤 按键说话」标签切换）：
     ptt  按键说话：点麦克风开始听，再点一次结束，自动识别并回复
     vad  连续对话：点一次进入持续监听，说完停顿约 1 秒自动识别并回复，她说话时自动闭嘴
   轮询 /api/voice/state 拿状态和音量电平，转写文字由后端自动接去对话，
   回复仍走原来的 /api/last -> 气泡 + 语音，所以文字聊天那套完全不变。 */
(function(){
  const mic    = document.getElementById('mic');
  const ring   = document.getElementById('micRing');
  const modeEl = document.getElementById('vmode');
  const stat   = document.getElementById('vstat');
  if (!mic) return;

  // 默认"连续对话"：点一次开始听，说完停顿约 1 秒她自动识别并回你，
  // 不用再点第二次（之前默认的按键说话要再点一次才结束，容易被当成"没反应"）
  let mode = 'vad';
  let active = false;        // 会话是否进行中
  let recording = false;     // 是否正在收音
  let micBusy = false;       // 她正在想/正在说：麦克风不可用
  let lastSeq = -1;          // 已展示过的转写序号
  let lastPhase = null;

  function post(path, obj){
    return fetch(path, { method:'POST', headers:{'Content-Type':'application/json'},
                         body: JSON.stringify(obj || {}) }).then(function(r){ return r.json(); });
  }
  function setStat(t, kind){
    stat.textContent = t || '';
    stat.className = kind || '';
  }
  function setMic(){
    mic.classList.toggle('on', recording);
    mic.classList.toggle('busy', micBusy && !recording);
    mic.textContent = recording ? '⏹' : (micBusy ? '💭' : '🎤');
    mic.title = recording ? '正在听你说话，点击结束'
              : (micBusy ? '她正在回复，等她说完再点' : '点击开始说话');
    ring.classList.toggle('live', recording);
  }
  function renderMode(){
    modeEl.textContent = mode === 'vad' ? '🎙 连续对话' : '🎤 按键说话';
    modeEl.title = mode === 'vad' ? '当前：连续对话（说完停顿自动识别），点击切成按键说话'
                                  : '当前：按键说话（点了才听、再点结束），点击切成连续对话';
  }

  // ---- 轮询状态 ----
  let lastState = null, lastOnline = null;
  function poll(){
    fetch('/api/voice/state').then(function(r){ return r.json(); }).then(function(j){
      if (!j || !j.asr_online){
        if (lastOnline !== false){
          lastOnline = false;
          xlog('ASR 离线', String((j && j.error) || '语音识别服务未启动'));
        }
        setStat('语音服务没启动，见 asr_err.log', 'err');
        setMic();
        return;
      }
      if (lastOnline !== true){
        lastOnline = true;
        xlog('ASR 在线', '设备=' + (j.device || '?'));
      }
      // 壳是否在线（后端心跳判定）：决定点击归谁处理，见 hasShell()
      if (shellOnline !== !!j.shell_online){
        shellOnline = !!j.shell_online;
        xlog('桌面壳状态', shellOnline ? '在线：点击由壳的隐形层接管'
                                      : '未检测到（页面自行处理点击）');
      }
      // 状态跃迁记录：排查"说完不回"就靠这一段（能看到电平有没有超过阈值）
      if (j.state !== lastState){
        xlog('状态变化', String(lastState) + ' -> ' + j.state
             + ' 电平=' + j.level + ' 原始=' + j.raw_level + ' 阈值=' + j.thr
             + ' 在语音=' + j.in_speech + ' 静音计数=' + j.silence_run);
        lastState = j.state;
      }
      if (j.mode && j.mode !== mode){
        mode = j.mode;
        renderMode();
        xlog('界面模式同步', mode);
        setTimeout(pushRects, 60);     // 标签文字变了，宽度也变，位置要重报
      } else {
        renderMode();
      }
      recording = !!j.recording;
      active = j.state !== 'off';

      /* ★ 阶段（phase）由后端统一给出，覆盖"等模型响应"这段以前毫无反馈的空白：
           waiting_model 已取走转写、大脑还没返回（最长，最需要提示）
           waiting_play  回复已生成、页面还没开口
           playing       正在播放她的语音
         这三个阶段麦克风都不能用，样式上也要区分开，避免用户误以为"卡住了"。 */
      const phase = j.phase || '';
      micBusy = (phase === 'waiting_model' || phase === 'waiting_play'
                 || phase === 'playing' || phase === 'wrapping'
                 || (!!j.busy && !recording));
      if (phase !== lastPhase){
        xlog('阶段变化', String(lastPhase) + ' -> ' + phase
             + '（已 ' + (j.phase_secs || 0) + 's）');
        lastPhase = phase;
      }

      // 音量光圈：电平越高光圈越大
      if (recording){
        const lv = Math.max(0, Math.min(1, (j.level || 0) * 6));
        ring.style.transform = 'scale(' + (1 + lv * 0.9).toFixed(2) + ')';
        ring.style.opacity = String(0.35 + lv * 0.65);
        setStat(mode === 'vad' ? '🎤 在听…说完停一下' : '🎤 在听…再点一次结束', 'on');
      } else if (phase === 'waiting_model'){
        const s = j.phase_secs || 0;
        setStat('🧠 正在想…' + (s >= 1 ? (s >= 10 ? s.toFixed(0) : s.toFixed(1)) + 's' : ''),
                s >= 8 ? 'slow' : 'wait');
      } else if (phase === 'waiting_play'){
        setStat('准备开口…', 'wait');
      } else if (phase === 'playing'){
        const left = j.playback_left || 0;
        setStat('🔊 正在说…' + (left > 0.2 ? left.toFixed(1) + 's' : ''), 'on');
      } else if (phase === 'wrapping'){
        setStat('快好了…', 'wait');
      } else if (j.state === 'thinking'){
        setStat('正在识别…');
      } else if (j.state === 'pending'){
        setStat('识别到了，等她回话', 'on');
      } else if (active){
        setStat(j.detail || '');
      } else {
        setStat('');
      }
      setMic();

      // 转写出来的文字在气泡里闪一下，让她"听懂了什么"可见
      if (j.text && j.seq !== lastSeq){
        lastSeq = j.seq;
        if (typeof window.xiaoyunSay === 'function') window.xiaoyunSay('我听到：' + j.text);
      }
    }).catch(function(){});
  }
  setInterval(poll, 400);

  // ---- 点麦克风 ----
  mic.addEventListener('click', function(ev){
    ev.stopPropagation();
    xlog('麦克风点击(页面)', 'recording=' + recording + ' shell=' + hasShell());
    // 桌面壳在时就交给壳的隐形点击层处理（它盖在同一个位置，且永远是最顶层）。
    // 页面这里再发一次请求，会和壳的请求叠加成"开完立刻关"——正是"点了没反应"的成因。
    if (hasShell()){
      xlog('麦克风点击(页面)', '桌面壳接管，页面不重复触发');
      return;
    }
    if (micBusy){
      setStat(lastPhase === 'waiting_model' ? '她正在想，等一下…' : '她正在说，等一下…', 'wait');
      return;
    }
    if (window.xiaoyunSpeaking){
      setStat('她在说话，等一下…', 'err');
      return;
    }
    if (!recording){
      post('/api/voice/start', { mode: mode }).then(function(j){
        if (!j.ok) setStat(j.error || '启动失败', 'err');
        else setStat(mode === 'vad' ? '🎤 在听…说完停一下' : '🎤 在听…再点一次结束', 'on');
      }).catch(function(){ setStat('启动失败', 'err'); });
    } else {
      post('/api/voice/stop').catch(function(){});
    }
  });

  // ---- 切换模式 ----
  modeEl.addEventListener('click', function(ev){
    ev.stopPropagation();
    xlog('模式切换点击(页面)', '当前=' + mode + ' shell=' + hasShell());
    // 同麦克风：桌面壳在时由壳的隐形点击层代劳，页面不重复触发
    if (hasShell()){
      xlog('模式切换点击(页面)', '桌面壳接管，页面不重复触发');
      return;
    }
    const next = mode === 'vad' ? 'ptt' : 'vad';
    post('/api/voice/mode', { mode: next }).then(function(j){
      if (j.ok){
        mode = next;
        renderMode();
        setStat(mode === 'vad' ? '连续对话：点麦克风开始，说完自动识别'
                               : '按键说话：点了才听，再点一次结束');
      }
    }).catch(function(){});
  });

  // ---- 她说完话了：告诉后端可以继续听了 ----
  // 播放只由上面的气泡模块负责（避免两个声音重合），这里只挂"播完"的钩子。
  // seq 参数是该段音频所属的回复序号：后端用它丢弃"过期"的播完通知。
  window.xiaoyunAudioEnded = function(endedSeq){
    xlog('通知后端恢复收音', '/api/voice/resume seq=' + endedSeq);
    post('/api/voice/resume', { seq: endedSeq }).catch(function(){});
  };

  /* 透明桌面模式下 WebView2 收不到鼠标事件（微软已知限制），页面上的点击由壳的
     隐形点击层代劳。控件位置受 DPI 缩放影响壳猜不准，所以把真实位置报上去。
     两个控件都要报：麦克风按钮 + 「🎙 模式切换」标签（后者以前完全没有点击层）。

     ★★ 坐标走本地 HTTP，绝不要走 pywebview 的 JS 桥（report_mic_rect）。
       教训：JS 桥是"同步回环"调用，要在桌面壳的主线程上执行；页面按固定频率推坐标
       会把 WebView2 的 UI 线程堵死 —— 实测表现就是"桌宠卡死"：窗口变成"(未响应)"
       (IsHungAppWindow=True)，并连带让 dwm 生成 Ghost 替身窗口，把该区域的点击全部
       吃掉。HTTP 是异步的，永远卡不住 UI（本页的触发日志一直走 HTTP，从未出问题）。 */
  let lastMicReported = null, lastModeReported = null;
  function pushRects(){
    try{
      var m = document.getElementById('micWrap').getBoundingClientRect();
      var d = document.getElementById('vmode').getBoundingClientRect();
      if (!lastMicReported || Math.abs(lastMicReported.x - m.left) > 1
                            || Math.abs(lastMicReported.y - m.top) > 1
                            || Math.abs(lastMicReported.w - m.width) > 1){
        xlog('上报麦克风按钮位置', 'x=' + Math.round(m.left) + ' y=' + Math.round(m.top)
             + ' w=' + Math.round(m.width)
             + (lastMicReported ? '（相对上次 Δx=' + Math.round(m.left - lastMicReported.x) + '）' : '')
             + ' 视口=' + window.innerWidth + 'x' + window.innerHeight);
        lastMicReported = { x: m.left, y: m.top, w: m.width };
      }
      if (!lastModeReported || Math.abs(lastModeReported.x - d.left) > 1
                             || Math.abs(lastModeReported.y - d.top) > 1
                             || Math.abs(lastModeReported.w - d.width) > 1){
        xlog('上报模式标签位置', 'x=' + Math.round(d.left) + ' y=' + Math.round(d.top)
             + ' w=' + Math.round(d.width) + ' h=' + Math.round(d.height)
             + (lastModeReported ? '（相对上次 Δx=' + Math.round(d.left - lastModeReported.x) + '）' : ''));
        lastModeReported = { x: d.left, y: d.top, w: d.width };
      }
      post('/api/ui/rects', {
        mic:  [m.left, m.top, m.width, m.height],
        mode: [d.left, d.top, d.width, d.height],
        vw: window.innerWidth, vh: window.innerHeight
      }).catch(function(){});
      return true;
    }catch(e){ return false; }
  }

  /* ★ 控件位置必须"常驻上报"，绝不能只在加载时报一次。
     真实教训：这排控件的横向位置会随状态文字的长度变化而移动（#voice 是收缩宽度的
     容器，历史上它把麦克风按钮推走了约 40 CSS px）。只报一次的话，壳就一直拿着加载
     那一刻的过时坐标去盖隐形点击层 —— 用户点得明明正中按钮，却被判成"点了身体"并
     弹出聊天窗。现在每 0.6s 无条件把最新坐标推给壳：任何位移都会在 0.6s 内被纠正，
     坐标再也不会过时（第一道保险是把布局改成右对齐、从根上不漂）。 */
  let rectWatch = null;
  function startRectWatch(){
    if (rectWatch) return;                       // 只启一次
    pushRects();
    rectWatch = setInterval(pushRects, 600);
    xlog('控件位置常驻上报', '每 0.6s 经 HTTP 同步给桌面壳（不占用 JS 桥）');
  }
  startRectWatch();
  addEventListener('resize', function(){ setTimeout(pushRects, 300); });

  renderMode();
  setStat('点麦克风或按 Ctrl+Alt+V 开始说话');
  xlog('语音模块就绪', '默认 mode=' + mode + ' shell=' + hasShell());
})();
</script>
</body>
</html>
