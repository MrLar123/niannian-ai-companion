<!DOCTYPE html>
<html style="margin:0;padding:0;">
<head>
<meta charset="UTF-8">
<title>念念 VRM</title>
<style>
  :root{ --pink:#EAA7B2; --ink:#2a2230; }
  *{ box-sizing:border-box; }
  /* 页面必须保持真透明：桌面壳把 WinForms 窗体底色刷成色键色（见 desktop_app.py 的 KEY_COLOR）。
     渲染器 alpha:true + 清屏透明度 0，这里再透一层就干净了。 */
  html,body{
    margin:0; padding:0; width:100%; height:100%; overflow:hidden;
    background:transparent;
    font-family:"PingFang SC","Microsoft YaHei",Segoe UI,Arial,sans-serif;
    user-select:none; -webkit-user-select:none; cursor:default;
  }
  #stage{ position:absolute; inset:0; }
  #stage canvas{ display:block; width:100% !important; height:100% !important; }

  #bubble{ position:absolute; left:50%; top:14px; transform:translate(-50%,8px);
    max-width:88%; z-index:20; opacity:0; transition:opacity .25s,transform .25s;
    background:rgba(255,255,255,.95); border:1px solid rgba(217,120,145,.45);
    border-radius:16px; padding:11px 15px; font-size:14px; line-height:1.6; color:var(--ink);
    box-shadow:0 6px 22px rgba(217,120,145,.28); pointer-events:none; }
  #bubble.show{ opacity:1; transform:translate(-50%,0); }
  #bubble:after{ content:""; position:absolute; left:50%; bottom:-9px; margin-left:-8px;
    border:9px solid transparent; border-top-color:rgba(255,255,255,.95); border-bottom:0; }

  #tip{ position:absolute; left:0; right:0; bottom:4px; text-align:center; z-index:15;
    font-size:11px; color:#8a7d8c; opacity:0; transition:opacity .6s; pointer-events:none;
    text-shadow:0 1px 3px rgba(255,255,255,.95); }

  /* ---- 思考中指示（P3 DSH：大脑真状态，/api/brain/state 轮询驱动） ---- */
  #think{ position:absolute; left:50%; top:14px; transform:translate(-50%,8px);
    z-index:21; opacity:0; transition:opacity .25s,transform .25s;
    background:rgba(255,255,255,.92); border:1px solid rgba(150,120,180,.38);
    border-radius:14px; padding:6px 12px; font-size:12px; color:#6b5f7a;
    box-shadow:0 4px 14px rgba(120,100,170,.18); pointer-events:none; }
  #think.show{ opacity:1; transform:translate(-50%,0); }
  #think .dot{ display:inline-block; width:5px; height:5px; margin:0 2px;
    border-radius:50%; background:#9c8fc0; animation:thinkpulse 1.1s infinite; }
  #think .dot:nth-child(2){ animation-delay:.18s }
  #think .dot:nth-child(3){ animation-delay:.36s }
  @keyframes thinkpulse{ 0%,60%,100%{opacity:.25; transform:translateY(0)}
    30%{opacity:1; transform:translateY(-3px)} }

  /* ---- 语音对话控件（与 desktoppmx 完全同款：右对齐防漂移布局） ---- */
  #voice{ position:absolute; right:19%; bottom:12px; z-index:30;
    display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #micWrap{ position:relative; width:38px; height:38px; }
  #mic{ width:38px; height:38px; border-radius:50%; cursor:pointer;
    border:1px solid rgba(217,120,145,.55); background:rgba(255,255,255,.92);
    box-shadow:0 3px 12px rgba(217,120,145,.3); display:flex; align-items:center;
    justify-content:center; font-size:17px; color:#c25c78; padding:0;
    transition:transform .15s, background .2s; pointer-events:auto; }
  #mic:hover{ transform:scale(1.08); }
  #mic:active{ transform:scale(0.94); }
  #mic.on{ background:#e05a76; color:#fff; border-color:#e05a76;
    animation:pulse 1.1s ease-in-out infinite; }
  #mic.busy{ background:#f3d9a0; border-color:#e0b45f; color:#8a6a1f;
    animation:busypulse 1.8s ease-in-out infinite; }
  @keyframes busypulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(224,180,95,.55); }
    50%{ box-shadow:0 0 0 7px rgba(224,180,95,0); }
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(224,90,118,.55), 0 3px 12px rgba(217,120,145,.3); }
    50%{ box-shadow:0 0 0 9px rgba(224,90,118,0), 0 3px 12px rgba(217,120,145,.3); }
  }
  #micRing{ position:absolute; left:50%; top:50%; width:38px; height:38px;
    margin-left:-19px; margin-top:-19px; border-radius:50%;
    border:2px solid rgba(224,90,118,.95); opacity:0; transform:scale(1);
    pointer-events:none; }
  #micRing.live{ opacity:1; }
  #vmode{ font-size:10px; color:#8a7d8c; background:rgba(255,255,255,.85);
    border:1px solid rgba(217,120,145,.35); border-radius:9px; padding:2px 7px;
    cursor:pointer; pointer-events:auto; user-select:none; white-space:nowrap; }
  #vstat{ font-size:11px; color:#a08a97; max-width:150px; text-align:center;
    line-height:1.35; pointer-events:none; min-height:14px; }
  #vstat.wait{ color:#b0762f; font-weight:600; }
  #vstat.slow{ color:#c25c1f; font-weight:600; animation:slowblink 1.6s ease-in-out infinite; }
  @keyframes slowblink{ 0%,100%{opacity:.55;} 50%{opacity:1;} }
  #vstat.on{ color:#d24a66; font-weight:600; }
  #vstat.err{ color:#c0392b; font-weight:600; }
  /* 预览窗（?model= / ?tune）：没有语音服务，别显示麦克风和它的报错 */
  body.preview #voice{ display:none; }
</style>
